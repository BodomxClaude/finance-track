<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F46C8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance Track">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Finance Track</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Seitenleiste + Inhaltsspalte am PC, einspaltig mit Tab-Leiste und Plus-Knopf am Handy. Beträge stehen wie im Kontoauszug in Festbreite. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunken:#E9ECF4; --ink:#141B2D; --muted:#5A6480; --line:#D9DEEA;
  --accent:#2F46C8; --accent-ink:#FFFFFF; --accent-soft:#E3E7FB;
  --inc:#0F7B58; --exp:#BF3B2B; --warn:#9A6400; --exp-soft:#FBE7E3; --inc-soft:#DDF3EA;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px rgba(20,27,45,.06);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D111D; --surface:#161B2C; --sunken:#1E2438; --ink:#E9EDF7; --muted:#97A1BB; --line:#293149;
  --accent:#93A2FF; --accent-ink:#0D111D; --accent-soft:#222B52;
  --inc:#4FC592; --exp:#F2836F; --warn:#E3B04B; --exp-soft:#3A1F1E; --inc-soft:#153427;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D111D; --surface:#161B2C; --sunken:#1E2438; --ink:#E9EDF7; --muted:#97A1BB; --line:#293149;
  --accent:#93A2FF; --accent-ink:#0D111D; --accent-soft:#222B52;
  --inc:#4FC592; --exp:#F2836F; --warn:#E3B04B; --exp-soft:#3A1F1E; --inc-soft:#153427;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .inc{color:var(--inc)} .exp{color:var(--exp)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Bedienelemente */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--exp);border-color:var(--exp)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:none}
.iconbtn:hover{background:var(--sunken)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--exp);font-size:14px;min-height:1.4em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--inc-soft);color:var(--inc)} .pill.bad{background:var(--exp-soft);color:var(--exp)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}

/* Sperrbildschirm */
.lock{max-width:440px;margin:0 auto;padding-block:clamp(28px,8vh,88px) 40px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px var(--display)}
.brand b{font:700 26px/1 var(--display)}
.lock h1{font-size:clamp(28px,6vw,36px);line-height:1.1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.plist{display:flex;flex-direction:column;gap:8px}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600}
.pbtn:hover{border-color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px var(--display);flex:none;background:var(--muted)}
.pbtn .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--muted);padding:0;margin:0;list-style:none}
.facts li{display:flex;gap:10px;align-items:flex-start}
.facts svg{margin-top:1px;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* App-Rahmen */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);gap:36px;max-width:1120px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));height:calc(100dvh - env(safe-area-inset-top,0px));padding-block:24px;display:flex;flex-direction:column;gap:20px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;font-weight:500;color:var(--muted);text-align:left}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.who .grow{flex:1;min-width:0}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:12px}
main{min-width:0;padding-bottom:48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 14px}
.top h1{font-size:26px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px}
.monthnav b{min-width:136px;text-align:center;font-weight:600}
.mobile-only{display:none}
.tabbar,.fab{display:none}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card>h2{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}

/* Übersicht */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:end}
.saldo{font:700 clamp(38px,8vw,60px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:baseline}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.cat{display:flex;flex-direction:column;gap:6px}
.cat+.cat{margin-top:14px}
.cat .line1{display:flex;align-items:center;gap:10px}
.cat .line1 .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--muted)}
.cat small{color:var(--muted);font-size:12.5px}
.trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
.tcol{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tbars{height:132px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:1px solid var(--line)}
.tbars i{display:block;width:min(18px,36%);min-height:2px;border-radius:4px 4px 0 0}
.tbars .bi{background:var(--inc)} .tbars .be{background:var(--exp)}
.tcol.cur{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Buchungen */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools .input{flex:1 1 200px;width:auto}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button,.seg label{padding:7px 14px;border-radius:8px;border:0;background:none;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"],.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.day{display:flex;justify-content:space-between;gap:12px;padding:16px 4px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.tx:hover{background:var(--sunken)}
.tx .grow{flex:1;min-width:0}
.tx b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--muted);font-size:12.5px}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty p{max-width:42ch;color:var(--muted)}

/* Listen in Einstellungen */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lrow:first-of-type{border-top:0}
.lrow .grow{flex:1 1 140px;min-width:0}
.lrow .input{width:120px;min-height:38px;text-align:right}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid .full{grid-column:1/-1}
.prose{max-width:65ch;color:var(--muted)}

/* Dialog + Hinweis */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,25,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(480px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.sheet h2{font-size:21px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

[hidden]{display:none!important}
.toastbtn{margin-left:10px;border:0;background:none;color:var(--accent-soft);font:inherit;font-weight:700;text-decoration:underline;padding:4px 2px;cursor:pointer}
.lrow.acc{flex-wrap:nowrap}
.accbtns{display:flex;gap:0;flex:none}
.accbtns .iconbtn{width:36px;height:36px}
.iconbtn[disabled]{opacity:.3;cursor:default}
.two{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.two small{font-size:12.5px}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:13.5px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table.prev{border-collapse:collapse;width:100%;font-size:13.5px}
table.prev th,table.prev td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.prev th{color:var(--muted);font-weight:600}
.chart{display:block;max-width:100%;height:auto}
.chart text{font:12px var(--body);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .cost{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:8px 16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:var(--sunken);min-width:0}
.kpi b{font-size:18px;font-weight:600;white-space:nowrap}
@media (max-width:560px){
  .kpis{grid-template-columns:minmax(0,1fr);gap:8px}
  .kpi{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 12px;padding:10px 12px}
  .kpi b{text-align:right;font-size:16px}
  .kpi small{grid-column:1/-1}
}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi .eyebrow{text-transform:none;letter-spacing:.02em;font-size:13px}
.chart .pt.auto{fill:var(--accent)}
/* Anklickbare Werte in der Übersicht führen zu den passenden Buchungen */
.catbtn{display:flex;flex-direction:column;gap:6px;width:100%;padding:8px;margin:-8px;margin-inline:-8px;border:0;border-radius:10px;background:none;text-align:left;color:inherit;font:inherit}
.catbtn:hover{background:var(--sunken)}
.catbtn .bar{display:block}
.cat.catbtn+.cat.catbtn{margin-top:6px}
.kvwrap{display:flex;flex-direction:column;gap:8px}
.kvbtn{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:4px 8px;margin:-4px -8px;border:0;border-radius:8px;background:none;text-align:left;color:inherit;font:inherit}
.kvbtn:hover{background:var(--sunken)}
.kvbtn>span:first-child{color:var(--muted)}
.tbars button{display:block;width:min(18px,36%);min-height:2px;border:0;padding:0;border-radius:4px 4px 0 0;cursor:pointer}
.tbars button:hover{opacity:.75}
.tcol .mbtn{border:0;background:none;color:inherit;font:inherit;padding:2px 6px;border-radius:6px}
.tcol .mbtn:hover{background:var(--sunken)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);font-size:13px;font-weight:600}
.fchip svg{width:16px;height:16px}
.fsum{display:flex;justify-content:space-between;gap:12px;padding:14px 4px 0;font-size:13.5px;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .mobile-only{display:inline-grid}
  main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  .top{padding-block:14px 12px}
  .top h1{font-size:22px}
  .hero,.grid2{grid-template-columns:minmax(0,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(47,70,200,.4)}
  .fab svg{width:26px;height:26px}
  #modal{place-items:end center;padding:0}
  .sheet{width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-height:92dvh}
  .formgrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){ .spin{animation-duration:2s} }
</style>

</head>
<body>
<div id="root"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* ---------- Hilfen ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : "#6B7A99";
const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
const pad = n => String(n).padStart(2, "0");
const ymOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
const isoOf = d => ymOf(d) + "-" + pad(d.getDate());
const addMonth = (ym, n) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + n, 1)); };
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return new Intl.DateTimeFormat("de-DE", { month: "long", year: "numeric" }).format(new Date(y, m - 1, 1)); };
const monthShort = ym => { const [y, m] = ym.split("-").map(Number); return new Intl.DateTimeFormat("de-DE", { month: "short" }).format(new Date(y, m - 1, 1)).replace(".", ""); };
const dayLabel = iso => { const [y, m, d] = iso.split("-").map(Number); return new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "numeric", month: "long" }).format(new Date(y, m - 1, d)); };
const EUR = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const EUR0 = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const fmt = c => EUR.format(c / 100);
const fmtIn = c => (c / 100).toFixed(2).replace(".", ",");
function parseAmt(s) {
  s = String(s || "").replace(/[\s€]/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const v = Number(s);
  if (!isFinite(v) || v <= 0 || v > 1e9) return null;
  return Math.round(v * 100);
}
const ICONS = {

let syncChain = Promise.resolve();
function onStore() {

async function sync() {

  if (!pd) { if (S.store.ready && !S.store.stale) lock("Dieses Profil wurde gelöscht."); return; }
  if (pd.ct === S.ct[pdocId(pid)]) S.meta = pd;
  else if (!S.sDirty) {
    try { const s = await unseal(key, pd, pdocId(pid)); if (S.key !== key || S.sDirty) return; S.settings = s; S.ct[pdocId(pid)] = pd.ct; S.meta = pd; } catch (e) {}
  }
  const idoc = S.store.docs.get(idocId(pid));
  if (idoc && idoc.ct !== S.ct[idocId(pid)] && !S.iDirty) {
    try { const o = await unseal(key, idoc, idocId(pid)); if (S.key !== key) return; if (!S.iDirty) { S.inv = { ...defaultInv(), ...o }; S.ct[idocId(pid)] = idoc.ct; } } catch (e) {}
  }

    try { const o = await unseal(key, d, id); if (S.key !== key) return; if (S.dirty.has(m)) continue; S.months[m] = Array.isArray(o.tx) ? o.tx : []; S.ct[id] = d.ct; } catch (e) {}
  }
  if (S.key !== key) return;

/* Fingerabdruck / Gesichtserkennung über WebAuthn (PRF): nur in der eigenständigen App, der Schlüssel bleibt an das Gerät gebunden. */
const BIO_P = "saldo1bio:";
const bioOk = () => !window.claude && !!window.PublicKeyCredential && !!navigator.credentials && window.isSecureContext;
const bioGet = pid => { try { return JSON.parse(localStorage.getItem(BIO_P + pid)); } catch (e) { return null; } };
const bioDrop = pid => { try { localStorage.removeItem(BIO_P + pid); } catch (e) {} };
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function bioKey(prfOut) {
  const base = await crypto.subtle.importKey("raw", prfOut, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: te.encode("finance-track-bio-v1") }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function bioAssert(credId, salt) {
  const cred = await navigator.credentials.get({ publicKey: { challenge: rnd(32), rpId: location.hostname, allowCredentials: [{ type: "public-key", id: credId }], userVerification: "required", timeout: 60000, extensions: { prf: { eval: { first: salt } } } } });
  const r = cred.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw Object.assign(new Error("noprf"), { noprf: true });
  return new Uint8Array(r.results.first);
}
async function bioEnable(pw) {
  const raw = await unwrapRaw(pw, S.meta).catch(() => { throw Object.assign(new Error("pw"), { pw: true }); });
  const cred = await navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: "Finance Track", id: location.hostname },
    user: { id: te.encode(S.pid), name: S.meta.name, displayName: S.meta.name }, pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred" }, timeout: 60000, extensions: { prf: {} } } });
  const ext = cred.getClientExtensionResults().prf;
  if (!ext || !ext.enabled) throw Object.assign(new Error("noprf"), { noprf: true });
  const credId = new Uint8Array(cred.rawId), salt = rnd(32), wiv = rnd(12);
  const k = await bioKey(await bioAssert(credId, salt));
  const wk = await crypto.subtle.encrypt({ name: "AES-GCM", iv: wiv }, k, raw); raw.fill(0);
  localStorage.setItem(BIO_P + S.pid, JSON.stringify({ id: b64(credId), salt: b64(salt), wiv: b64(wiv), wk: b64(wk) }));
}
async function bioUnlock(pid) {
  const b = bioGet(pid), out = await bioAssert(unb64(b.id), unb64(b.salt)), k = await bioKey(out);
  let raw;
  try { raw = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(b.wiv) }, k, unb64(b.wk))); await openProfile(pid, raw); }
  catch (e) { bioDrop(pid); throw Object.assign(new Error("stale"), { stale: true }); }
}
async function unlock(pid, pw) {
  await openProfile(pid, await unwrapRaw(pw, S.store.docs.get(pdocId(pid))));
}
async function openProfile(pid, raw) {
  const doc = S.store.docs.get(pdocId(pid));
  const key = await importDek(raw); raw.fill(0);
  const settings = await unseal(key, doc, pdocId(pid));
  Object.assign(S, { pid, key, meta: doc, settings, inv: defaultInv(), months: {}, ct: { [pdocId(pid)]: doc.ct }, month: ymOf(new Date()), view: "overview" });
  S.fails = 0;
  renderShell(); armIdle();
  await (syncChain = syncChain.then(sync).catch(() => {}));
}
async function createProfile(name, pw) {
  const pid = rid(), raw = crypto.getRandomValues(new Uint8Array(32));

  const key = await importDek(raw); raw.fill(0);
  const settings = defaultSettings();

  const doc = { v: 1, kind: "profile", name, color: CAT_COLORS[used % CAT_COLORS.length], ...wrap, ...box };
  await S.store.set(pdocId(pid), doc);
  Object.assign(S, { pid, key, meta: doc, settings, inv: defaultInv(), months: {}, ct: { [pdocId(pid)]: doc.ct }, month: ymOf(new Date()), view: "overview" });

const EUR4 = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 4 });
const signed = c => (c < 0 ? "−" : "+") + fmt(Math.abs(c));
const pct = (a, b) => b > 0 ? (a / b * 100).toLocaleString("de-DE", { maximumFractionDigits: 1, signDisplay: "always" }) + " %" : "–";
const shortDate = iso => iso.split("-").reverse().join(".");
const numIn = (n, d = 4) => n ? String(Math.round(n * 10 ** d) / 10 ** d).replace(".", ",") : "";
const KIND = { etf: "ETF", stock: "Aktie", crypto: "Krypto", other: "Sonstiges" };
const STRAT = { long: "Langfristig", trade: "Trading" };
const asset = id => S.inv.assets.find(a => a.id === id) || { id: "", name: "Unbekannt", kind: "other", strat: "long" };
const sumOf = (arr, k) => arr.reduce((s, x) => s + x[k], 0);
function parseNum(v) {
  if (typeof v === "number") return isFinite(v) ? v : null;
  let s = String(v ?? "").trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^[-\u2212\u2013]/.test(s) || /[-\u2212\u2013]$/.test(s);
  s = s.replace(/[^\d.,]/g, ""); if (!/\d/.test(s)) return null;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (lc > -1) s = s.split(",").length > 2 ? s.replace(/,/g, "") : s.replace(",", ".");
  else if (ld > -1) { const p = s.split("."); if (p.length > 2 || (p[1].length === 3 && p[0] !== "0" && p[0] !== "")) s = s.replace(/\./g, ""); }
  const n = Number(s); return isFinite(n) ? (neg ? -n : n) : null;
}
/* Bestand je Wertpapier nach FIFO: ältester Kauf wird zuerst verkauft, Gebühren zählen zum Einstand. */
function positions(until) {
  const by = {};
  const tr = S.inv.trades.filter(t => !until || t.d <= until).sort((a, b) => a.d.localeCompare(b.d) || (a.side === b.side ? 0 : a.side === "buy" ? -1 : 1));
  for (const t of tr) {
    const p = by[t.as] || (by[t.as] = { as: t.as, lots: [], realized: 0, closed: [] });
    if (t.side === "buy") p.lots.push({ q: t.q, c: t.amt + (t.fee || 0) });
    else {
      let q = t.q, cost = 0;
      while (q > 1e-9 && p.lots.length) { const l = p.lots[0], take = Math.min(q, l.q), part = l.c * take / l.q; cost += part; l.q -= take; l.c -= part; q -= take; if (l.q <= 1e-9) p.lots.shift(); }
      const pl = Math.round(t.amt - (t.fee || 0) - cost); p.realized += pl; p.closed.push({ t, pl });
    }
  }
  return Object.values(by).map(p => {
    const a = asset(p.as), q = sumOf(p.lots, "q"), open = q > 1e-9, cost = open ? Math.round(sumOf(p.lots, "c")) : 0, hasPx = a.px > 0;
    return { ...p, a, qty: open ? q : 0, cost, hasPx, value: open ? (hasPx ? Math.round(q * a.px * 100) : cost) : 0 };
  });
}

function buildImport() {
  if (I.mode === "blocks") return buildBlocks();
  if (I.mode === "wealth") return I.wealth || [];
  const M = I.map, cell = (r, k) => M[k] == null ? "" : r[M[k]], str = (r, k) => String(cell(r, k) ?? "").trim(), items = [];
  for (const r of I.rows) {
    const d = parseDate(cell(r, "date")); if (!d) continue;
    if (I.target === "tx") {
      let t, a; const iv = parseNum(cell(r, "inc")), ev = parseNum(cell(r, "exp")), n = parseNum(cell(r, "amount"));
      if (ev) { t = "exp"; a = Math.abs(ev); } else if (iv) { t = "inc"; a = Math.abs(iv); }
      else if (n) { a = Math.abs(n); t = M.type != null ? (/einnahme|income|haben|gutschrift|eingang/i.test(str(r, "type")) ? "inc" : "exp") : I.sign === "auto" ? (n < 0 ? "exp" : "inc") : I.sign; }
      else continue;
      items.push({ d, t, a: Math.round(a * 100), cat: str(r, "cat"), n: str(r, "note") });
    } else if (I.target === "trade") {
      const name = str(r, "name"), q0 = parseNum(cell(r, "qty")), px = parseNum(cell(r, "price")), am = parseNum(cell(r, "amount")); if (!name || !q0) continue;
      const q = Math.abs(q0), amt = px ? Math.round(q * Math.abs(px) * 100) : am ? Math.round(Math.abs(am) * 100) : 0; if (!amt) continue;
      const side = /verk|sell|sale/i.test(str(r, "side")) || q0 < 0 ? "sell" : "buy";
      items.push({ d, side, name, isin: str(r, "isin").toUpperCase(), q, amt, fee: Math.round(Math.abs(parseNum(cell(r, "fee")) || 0) * 100) });
    } else {
      const vals = {}; for (const j of Object.keys(I.cols)) if (I.cols[j]) { const v = parseNum(r[j]); if (v != null) vals[j] = Math.round(v * 100); }
      if (Object.keys(vals).length) items.push({ m: d.slice(0, 7), vals });
    }
  }
  return items;
}

  },
  async pw() {
    const err = $("#pw-err"), btn = $("#pw-btn"), n = $("#pw-new").value;
    if (n.length < 8) return err.textContent = "Das neue Passwort braucht mindestens 8 Zeichen.";
    if (n !== $("#pw-new2").value) return err.textContent = "Die neuen Passwörter stimmen nicht überein.";
    busy(btn, true, "Ändere …");
    let raw;
    try { raw = await unwrapRaw($("#pw-old").value, S.meta); } catch (e) { busy(btn, false); return err.textContent = "Das aktuelle Passwort stimmt nicht."; }
    try { const wrap = await wrapDek(n, raw); raw.fill(0); S.meta = { ...S.meta, ...wrap }; await S.store.set(pdocId(S.pid), S.meta); closeModal(); toast("Passwort geändert."); }
    catch (e) { busy(btn, false); err.textContent = "Das Passwort konnte nicht gespeichert werden."; }
  },
  async delProfile() {
    const err = $("#del-err"), btn = $("#del-btn");
    busy(btn, true, "Lösche …");
    try { (await unwrapRaw($("#del-pw").value, S.meta)).fill(0); } catch (e) { busy(btn, false); return err.textContent = "Das Passwort stimmt nicht."; }
    const pid = S.pid, ids = [...S.store.docs.keys()].filter(id => id.startsWith("m_" + pid + "_") || id === idocId(pid));
    S.key = null; bioDrop(pid);
    try { for (const id of ids) await S.store.del(id); await S.store.del(pdocId(pid)); } catch (e) {}
    lock("Profil gelöscht.");
  }
};

async function importBackup(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== "saldo" || typeof j.docs !== "object") throw 0;
    const clean = {}; let pid = null;
    for (const [id, d] of Object.entries(j.docs)) {
      const s = v => typeof v === "string" && v.length < 400000;
      if (/^p_[a-z0-9]{6,16}$/.test(id) && s(d.iv) && s(d.ct) && s(d.salt) && s(d.wiv) && s(d.wk)) { pid = id.slice(2); clean[id] = { v: 1, kind: "profile", name: String(d.name || "Profil").slice(0, 30), color: safeColor(d.color), salt: d.salt, iter: Number(d.iter) || ITER, wiv: d.wiv, wk: d.wk, iv: d.iv, ct: d.ct }; }
      else if (/^m_[a-z0-9]{6,16}_\d{4}-\d{2}$/.test(id) && s(d.iv) && s(d.ct)) clean[id] = { v: 1, kind: "month", iv: d.iv, ct: d.ct };
      else if (/^i_[a-z0-9]{6,16}$/.test(id) && s(d.iv) && s(d.ct)) clean[id] = { v: 1, kind: "invest", iv: d.iv, ct: d.ct };
    }
    if (!pid) throw 0;
    for (const id of Object.keys(clean)) if (id !== "p_" + pid && id !== "i_" + pid && !id.startsWith("m_" + pid + "_")) delete clean[id];
    if (S.store.docs.has("i_" + pid) && !clean["i_" + pid]) await S.store.del("i_" + pid);
    if (S.store.docs.has(pdocId(pid)) && !await confirmBox("Profil überschreiben?", `Das Profil „${clean[pdocId(pid)].name}“ ist schon vorhanden. Das Backup ersetzt seinen aktuellen Stand.`, "Überschreiben", true)) return;
    for (const id of [...S.store.docs.keys()]) if (id.startsWith("m_" + pid + "_") && !clean[id]) await S.store.del(id);
    for (const [id, d] of Object.entries(clean)) await S.store.set(id, d);
    L.mode = "list"; renderLock(); toast("Backup eingespielt. Entsperre das Profil mit seinem Passwort.");
  } catch (e) { toast("Diese Datei ist kein gültiges Finance-Track-Backup."); }
}
